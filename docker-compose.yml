services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library_db
    ports:
      - "3307:3306"
    volumes:
      - ./Devops_Project/library_db_setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - library-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-management-system:latest
    container_name: library-web
    restart: always
    ports:
      - "8085:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: library_db
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - library-net

networks:
  library-net:
    driver: bridge

volumes:
  mysql_data:
